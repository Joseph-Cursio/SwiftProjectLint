# Rules come from the shared configuration; only this project's paths are here.
# See ../SwiftLintConfig/README.md.
parent_config: ../SwiftLintConfig/.swiftlint.yml

included:
  - Sources
  - Tests
  - Packages
  - SwiftProjectLintTests

excluded:
  # Build output, including the nested packages' own build folders.
  - .build
  - "**/.build"
  - "**/.build-coverage"
  # swift-infer's generated verifier packages (gitignored).
  - "**/.swiftinfer"
  - .claude
  # Deliberately bad demo code: the input this linter exists to detect.
  - Sources/App/ExampleViews
  - ExampleCode
