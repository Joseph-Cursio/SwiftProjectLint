# This project's own code lives almost entirely in Packages/*, each a nested Swift
# package. Nested packages are skipped by default, so without this a self-lint run
# analyzed only Sources/ and Tests/ — a few dozen files out of ~790 — and silently
# reported nothing for rules whose only subjects are in Packages/. Dogfooding needs
# this on.
include_nested_packages: true

excluded_paths:
  - "ExampleViews/"
  - "ExampleCode/"

rules:
  "Discarded Try Result":
    excluded_paths:
      - "Tests/"
  # These enums are written out by value (--format json, the pbt-seeds manifest), so their raw
  # values are a wire format. Explicit raw values equal to the case names would satisfy this rule
  # but trip SwiftLint's default redundant_string_enum_value; instead the values are pinned by
  # Tests/CoreTests/Models/WireFormatRawValueTests.swift, which fails on a rename or an edited value.
  "Implicit Codable Raw Value":
    excluded_paths:
      - "SwiftProjectLintModels/IssueSeverity.swift"
      - "SwiftProjectLintModels/PBTSeedEffect.swift"
      - "SwiftProjectLintModels/PBTSeedRole.swift"
